name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-core:
    name: Firmware core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S firmware/test -B build/firmware-test
      - name: Build
        run: cmake --build build/firmware-test
      - name: Test
        run: ctest --test-dir build/firmware-test --output-on-failure

  firmware-build:
    name: Firmware compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Pinned download instead of arduino/setup-arduino-cli, which still runs on Node 20.
      - name: Install arduino-cli
        env:
          ARDUINO_CLI_VERSION: 1.5.1
          ARDUINO_CLI_SHA256: 28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b
        run: |
          archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fsSLO "https://downloads.arduino.cc/arduino-cli/${archive}"
          echo "${ARDUINO_CLI_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "${archive}" -C "$HOME/.local/bin" arduino-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache Arduino data
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('firmware/sketch.yaml') }}
      - name: Compile
        run: arduino-cli compile --profile feather firmware
